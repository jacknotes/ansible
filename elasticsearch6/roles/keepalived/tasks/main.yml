# Keepalived Installation and Configuration Tasks - Cross Platform (CentOS / RockyLinux / Ubuntu)
# 支持 CentOS 7/8, RockyLinux 8/9, Ubuntu 18.04/20.04/22.04/24.04/26.04

- name: Load OS-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}.yml"
    - "{{ ansible_distribution | lower }}.yml"
    - "{{ ansible_os_family | lower }}.yml"
    - "default.yml"
  tags: always


- block:
    - name: Install Keepalived (RHEL family)
      package:
        name: keepalived
        state: present

    - name: Install mailx for email notifications (RHEL family)
      package:
        name: mailx
        state: present
      when: keepalived_email_enabled | default(false)

    - name: Configure firewall for VRRP (RHEL family)
      firewalld:
        protocol: vrrp
        permanent: yes
        state: enabled
        immediate: yes
      ignore_errors: yes

  when: ansible_os_family == "RedHat"

# ========================
# Ubuntu 安装流程 (18.04/20.04/22.04/24.04/26.04)
# ========================
- block:
    - name: Update apt cache (Ubuntu)
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Keepalived (Ubuntu)
      apt:
        name: keepalived
        state: present

    - name: Install mailutils for email notifications (Ubuntu)
      apt:
        name: mailutils
        state: present
      when: keepalived_email_enabled | default(false)

    - name: Configure firewall for VRRP (Ubuntu)
      ufw:
        rule: allow
        proto: 112
      ignore_errors: yes

  when: ansible_os_family == "Debian"

# ========================
# 通用配置（CentOS / Ubuntu 共用）
# ========================
- name: Create Keepalived check script directory
  file:
    path: /etc/keepalived/scripts
    state: directory
    mode: '0755'

- name: Create Keepalived log file
  file:
    path: /var/log/keepalived-notify.log
    state: touch
    mode: '0644'
  when: (keepalived_dingtalk_enabled | default(false)) or (keepalived_email_enabled | default(false))

- name: Detect whether Nginx is running on this host
  shell: "systemctl is-active nginx"
  register: keepalived_nginx_running
  changed_when: false
  failed_when: false

- name: Detect whether Elasticsearch is listening on this host
  shell: "ss -tln | grep -q ':{{ es_http_port }} '"
  register: keepalived_es_listening
  changed_when: false
  failed_when: false

# 决策变量：默认 auto（按运行状态自动判断），可在 group_vars 中强制 yes/no
- name: Decide whether check script should check Nginx
  set_fact:
    keepalived_check_nginx: "{{ (keepalived_check_nginx | default('auto')) | string | lower in ['yes', 'true'] or ((keepalived_check_nginx | default('auto')) | string | lower == 'auto' and keepalived_nginx_running.rc == 0) }}"

- name: Decide whether check script should check Elasticsearch
  set_fact:
    keepalived_check_es: "{{ (keepalived_check_es | default('auto')) | string | lower in ['yes', 'true'] or ((keepalived_check_es | default('auto')) | string | lower == 'auto' and keepalived_es_listening.rc == 0) }}"

- name: Deploy health check script (dynamic by deployed services)
  template:
    src: check_services.sh.j2
    dest: /etc/keepalived/scripts/check_services.sh
    owner: root
    group: root
    mode: '0755'

- name: Deploy notification script
  template:
    src: notify.sh.j2
    dest: /etc/keepalived/scripts/notify.sh
    owner: root
    group: root
    mode: '0755'
  when: (keepalived_dingtalk_enabled | default(false)) or (keepalived_email_enabled | default(false))

- name: Deploy Keepalived configuration
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: restart keepalived

- name: Start and enable Keepalived service
  systemd:
    name: keepalived
    state: started
    enabled: yes
  when: not ansible_check_mode
